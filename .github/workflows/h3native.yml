name: h3native

# The native naive H3 server: a QUICHE backend that serves an operator website and
# terminates naive CONNECT tunnels, so the server half of the connection uses
# Chrome's QUIC implementation instead of Go's. See docs/native-h3-spike.md.
#
# The build is derived from a pinned QUICHE checkout rather than vendored, and it
# is heavy: QUICHE plus its dependencies is ~1800 compile actions. It therefore
# runs only on dispatch, not on every pull request. The kernel workflow already
# builds the same tree, and a future revision can share a cache with it.

on:
  workflow_dispatch:
    inputs:
      run_build:
        description: Build the native server (heavy; ~30-60 min from a cold cache)
        required: true
        default: true
        type: boolean

defaults:
  run:
    shell: bash

jobs:
  patch-check:
    name: check the QUICHE patches apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the pinned QUICHE revision
        id: rev
        run: echo "revision=$(bash h3native/build.sh --print-revision)" >> "$GITHUB_OUTPUT"

      - name: Fetch that revision
        run: |
          set -eu
          git init quiche
          git -C quiche remote add origin https://quiche.googlesource.com/quiche
          git -C quiche fetch --depth 1 origin "${{ steps.rev.outputs.revision }}"
          git -C quiche checkout FETCH_HEAD

      # The patches are the source of truth for what this repository changes in
      # QUICHE. Checking they apply is cheap and catches drift when the pin moves.
      - name: Apply the h3native patches
        run: |
          set -eu
          for patch in h3native/patches/[0-9]*.patch; do
            echo "applying $(basename "$patch")"
            git -C quiche apply --check --verbose "$patch"
          done
          echo "all patches apply to ${{ steps.rev.outputs.revision }}"

      - name: Confirm no QUICHE source is modified beyond the patches
        run: |
          set -eu
          for patch in h3native/patches/[0-9]*.patch; do
            git -C quiche apply "$patch"
          done
          # Every changed path must come from a patch; nothing may be edited
          # in place by the build script.
          changed=$(git -C quiche status --porcelain | awk '{print $2}')
          echo "$changed"
          unexpected=$(echo "$changed" | grep -v -E '^(quiche/BUILD\.bazel|MODULE\.bazel|quiche/quic/core/quic_config\.cc)$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected QUICHE changes: $unexpected"
            exit 1
          fi
          echo "only the three documented files change"

  build:
    name: build and smoke test
    runs-on: ubuntu-latest
    needs: patch-check
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          set -eu
          sudo apt-get update -qq
          # gurl builds against system ICU on Linux.
          sudo apt-get install -y -qq libicu-dev
          go install github.com/bazelbuild/bazelisk@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache the Bazel output tree
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
          key: h3native-bazel-${{ runner.os }}-${{ hashFiles('h3native/patches/*.patch') }}
          restore-keys: h3native-bazel-${{ runner.os }}-

      - name: Build
        run: bash h3native/build.sh --dir "$RUNNER_TEMP/quiche"

      - name: Smoke test -- serve a website over HTTP/3
        run: |
          set -eu
          built="$RUNNER_TEMP/quiche/bazel-bin/quiche/naivereal_h3_server"
          test -x "$built"

          mkdir -p "$RUNNER_TEMP/site"
          echo "native h3 smoke test" > "$RUNNER_TEMP/site/index.html"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" 2>/dev/null

          "$built" --port=8443 \
            --certificate_file="$RUNNER_TEMP/cert.pem" \
            --key_file="$RUNNER_TEMP/key.pem" \
            --web_root="$RUNNER_TEMP/site" \
            --username=user --password=pass \
            --upstream_addr=127.0.0.1:18080 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          # Build the probe and check the server answers, and that it advertises
          # the QUICHE transport-parameter shape the spike measured.
          (cd tools/naive-fp && bash orderhook/setup.sh && go build -o "$RUNNER_TEMP/naive-fp" .)
          for _ in $(seq 1 30); do
            if "$RUNNER_TEMP/naive-fp" probe -insecure https://127.0.0.1:8443/ \
                 > "$RUNNER_TEMP/native.json" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test -s "$RUNNER_TEMP/native.json"

          python3 - "$RUNNER_TEMP/native.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          ids = [p["id"] for p in d["transport_parameters"]]
          print("http:", d["http"]["status"], d["http"]["proto"])
          print("parameters:", len(ids))
          for name in ids:
              print("  -", name)
          if d["http"]["status"] != 200:
              sys.exit("the server did not serve the website")
          # version_information is the property that separates a QUICHE server
          # from the Go one in a single handshake.
          if "version_information" not in ids:
              sys.exit("version_information is missing: this is not QUICHE's shape")
          print("QUICHE transport-parameter shape confirmed")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naivereal-h3-server-linux-amd64
          path: ${{ runner.temp }}/quiche/bazel-bin/quiche/naivereal_h3_server
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-transport-parameters
          path: ${{ runner.temp }}/native.json
          if-no-files-found: warn
