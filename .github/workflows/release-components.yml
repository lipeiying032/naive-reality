name: release-components

on:
  push:
    tags:
      - "v*"
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Build h3frontend
        working-directory: h3frontend
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/naivereal-h3frontend-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../dist/naivereal-h3frontend-linux-arm64 .

      - name: Build frontend
        working-directory: frontend
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/naivereal-frontend-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../dist/naivereal-frontend-linux-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/naivereal-frontend-windows-amd64.exe .

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE="${{ github.ref_name }}"
          TITLE="naivereal $RELEASE"
          NOTES="naivereal $RELEASE unified release: kernel, REALITY frontend and H3 frontend."

          if gh release view "$RELEASE" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $RELEASE already exists; skipping create"
          else
            gh release create "$RELEASE" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "$TITLE" --notes "$NOTES"
          fi

          gh release upload "$RELEASE" --repo "${{ github.repository }}" dist/* --clobber
