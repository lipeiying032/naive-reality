name: h3frontend

on:
  push:
    paths: ["h3frontend/**", ".github/workflows/h3frontend.yml"]
  pull_request:
    paths: ["h3frontend/**", ".github/workflows/h3frontend.yml"]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Test
        working-directory: h3frontend
        run: go test ./...
      - name: Vet
        working-directory: h3frontend
        run: go vet ./...
      - name: Build Linux amd64
        working-directory: h3frontend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o h3frontend-linux-amd64 .
      - uses: actions/upload-artifact@v4
        with:
          name: h3frontend-linux-amd64
          path: h3frontend/h3frontend-linux-amd64
